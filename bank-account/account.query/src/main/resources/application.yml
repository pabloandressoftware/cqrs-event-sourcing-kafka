server:
  port: 5001

spring:
  jpa:
#     MySQL jpa settings
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    #MySQL datasource settings
      url: jdbc:mysql://localhost:3306/bankAccount?createDatabaseIfNotExist=true
      username: root
      password: techbankRootPsw
  kafka:
    # Same single topic the command side publishes to (see account.cmd application.yml)
    topic: BankAccountEvents
    listener:
      ack-mode: MANUAL_IMMEDIATE
    consumer:
      bootstrap-servers: localhost:29092
      group-id: bankaccConsumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
